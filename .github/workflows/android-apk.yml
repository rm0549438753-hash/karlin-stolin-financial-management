name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'apk-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # The APK is a shell that loads the live published site, so no web build
      # is needed. A placeholder is enough to satisfy Capacitor's webDir.
      - name: Prepare placeholder web assets
        run: |
          mkdir -p dist/client
          echo '<!doctype html><meta charset="utf-8"><title>Loading</title>' > dist/client/index.html

      - name: Install Capacitor CLI
        run: npm install --no-save @capacitor/cli@^7 @capacitor/core@^7 @capacitor/android@^7

      - name: Add Android platform
        run: npx cap add android

      - name: Set Hebrew app name
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('android/app/src/main/res/values/strings.xml')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'(<string name="app_name">).*?(</string>)', r'\1מרכז קארלין סטאלין\2', s)
          s = re.sub(r'(<string name="title_activity_main">).*?(</string>)', r'\1מרכז קארלין סטאלין\2', s)
          p.write_text(s, encoding='utf-8')
          print(s)
          PY

      - name: Sync Capacitor
        run: |
          mkdir -p android/app/src/main/assets/public
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karlin-stolin-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: מרכז קארלין סטאלין - אפליקציה
          body: |
            הורדה ישירה לטלפון: לחץ על app-debug.apk למטה.
          files: android/app/build/outputs/apk/debug/app-debug.apk

